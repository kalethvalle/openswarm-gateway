services:
  gateway:
    environment:
      LAYA_BASE_URL: http://laya:8001
    depends_on:
      laya:
        condition: service_healthy
  laya:
    build:
      context: .
      dockerfile: docker/laya.Dockerfile
    init: true
    environment:
      LAYA_API_KEY: ${LAYA_API_KEY:-}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - laya-models:/home/laya/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10m
volumes:
  laya-models:
